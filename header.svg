<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-label="Fernando Valdez. AI software engineer, founder of Futer.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="315" rx="16" fill="#0d0c0a" stroke="#35322c"/>

  <!-- top row -->
  <text x="48" y="62" class="mono" font-size="15" fill="#857f73"><tspan fill="#fcbf49">~/</tspan>barcelona, from buenos aires</text>
  <text x="846" y="62" class="mono" font-size="18" font-weight="700" fill="#f3efe6">ferlogs</text>
  <rect x="923" y="64" width="11" height="3" fill="#fcbf49">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- headline -->
  <text x="48" y="140" class="sans" font-size="66" font-weight="800" letter-spacing="-2.5" fill="#f3efe6">Fernando Valdez.</text>
  <text x="48" y="184" class="sans" font-size="28" font-weight="700" letter-spacing="-0.6" fill="#a8a294">AI software engineer, founder of Futer.</text>

  <!-- status rows -->
  <line x1="48" y1="208" x2="952" y2="208" stroke="#35322c"/>
  <circle cx="54" cy="231" r="4" fill="#fcbf49"/>
  <text x="70" y="236" class="mono" font-size="14" fill="#f3efe6">futer</text>
  <text x="220" y="236" class="mono" font-size="14" fill="#a8a294">live · piloting in Barcelona · co-founder seat open</text>

  <circle cx="54" cy="257" r="4" fill="#fcbf49"/>
  <text x="70" y="262" class="mono" font-size="14" fill="#f3efe6">luckybites</text>
  <text x="220" y="262" class="mono" font-size="14" fill="#a8a294">live in Barcelona · co-founder</text>

  <circle cx="54" cy="283" r="4" fill="none" stroke="#857f73"/>
  <text x="70" y="288" class="mono" font-size="14" fill="#f3efe6">ioBuilders</text>
  <text x="220" y="288" class="mono" font-size="14" fill="#a8a294">AI agents in production · read-only by default</text>
</svg>
